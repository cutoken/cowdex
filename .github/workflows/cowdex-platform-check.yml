name: Cowdex platform check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test public installation, update, and session
        run: python scripts/check_cowdex_release.py --report platform-check.json
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: platform-check-${{ matrix.runner }}
          path: platform-check.json
